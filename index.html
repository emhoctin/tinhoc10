
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Game Ôn Tập Tin Học 10</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React Libraries -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel Standalone to transpile JSX in browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- GenAI Library -->
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
      }
    }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        // All of our TSX/JS code will go here.
        // We will use JSX syntax and Babel will handle it.

        const { useState, useEffect, useMemo, useCallback } = React;

        // --- START: types.ts ---
        const GameState = {
            START: 'START',
            PREPARING: 'PREPARING',
            QUIZ: 'QUIZ',
            END: 'END',
            LEADERBOARD: 'LEADERBOARD',
            TEACHER_DASHBOARD: 'TEACHER_DASHBOARD',
        };

        // --- START: constants/questions.ts ---
        const questions = [
           {
                "id": 1,
                "question": "Mối quan hệ giữa Bit và Byte được hiểu đúng là gì?",
                "options": [ "A. 1 Byte=10 Bit", "B. 1 Byte= 8 Bit", "C. 1 Bit=8 Byte", "D. 1 Byte=16 Bit" ],
                "correctAnswer": "B. 1 Byte= 8 Bit",
                "topic": "Thông tin và dữ liệu",
                "difficulty": 1,
                "type": "single"
            },
            {
                "id": 2,
                "question": "Để chuyển đổi đơn vị đo lượng thông tin, phương án nào sau đây là ĐÚNG?",
                "options": [ "A. 1MB = 1024 KB.", "B. 1PB = 1024 GB.", "C. 1ZB = 1024 PB.", "D. 1Bit = 1024 B." ],
                "correctAnswer": "A. 1MB = 1024 KB.",
                "topic": "Thông tin và dữ liệu",
                "difficulty": 1,
                "type": "single"
            },
            // ... (All other questions from your questions.ts file would be pasted here) ...
            {
                "id": 1167,
                "question": "Minh sử dụng mạng xã hội hằng ngày để kết nối và học tập. Em hãy xác định các phát biểu sau là Đúng hay Sai về quy tắc ứng xử an toàn trên mạng:\nA. Khuyến khích sử dụng tên thật khi đăng ký tài khoản để tăng tính xác thực và trách nhiệm khi giao tiếp.\nB Không đăng tải thông tin cá nhân của người khác (hình ảnh, địa chỉ, số điện thoại) nếu chưa được đồng ý.\nC. Tham gia nhóm anti-fan, thường xuyên bình luận tiêu cực về người khác.\nD. Tham gia cộng đồng học tập và chia sẻ kinh nghiệm học tập.",
                "options": [ "A. Khuyến khích sử dụng tên thật khi đăng ký tài khoản để tăng tính xác thực và trách nhiệm khi giao tiếp.", "B Không đăng tải thông tin cá nhân của người khác (hình ảnh, địa chỉ, số điện thoại) nếu chưa được đồng ý.", "C. Tham gia nhóm anti-fan, thường xuyên bình luận tiêu cực về người khác.", "D. Tham gia cộng đồng học tập và chia sẻ kinh nghiệm học tập." ],
                "correctAnswer": [ "A. Khuyến khích sử dụng tên thật khi đăng ký tài khoản để tăng tính xác thực và trách nhiệm khi giao tiếp.", "B Không đăng tải thông tin cá nhân của người khác (hình ảnh, địa chỉ, số điện thoại) nếu chưa được đồng ý.", "D. Tham gia cộng đồng học tập và chia sẻ kinh nghiệm học tập." ],
                "topic": "Quy tắc ứng xử an toàn trên mạng (TH)",
                "difficulty": 2,
                "type": "multiple"
            }
        ];

        // --- START: services/gameService.ts ---
        const SCORES_KEY = 'tinHoc10Scores';

        const getAllRecords = () => {
          try {
            const records = localStorage.getItem(SCORES_KEY);
            return records ? JSON.parse(records) : [];
          } catch (error) {
            console.error("Error reading scores from localStorage", error);
            return [];
          }
        };

        const saveScore = (fullName, className, score) => {
          const allScores = getAllRecords();
          const newRecord = {
            fullName: fullName.trim(),
            className: className.trim(),
            score,
            timestamp: Date.now(),
          };
          allScores.push(newRecord);
          try {
            localStorage.setItem(SCORES_KEY, JSON.stringify(allScores));
          } catch (error) {
            console.error("Error saving score to localStorage", error);
          }
        };
        
        const getLeaderboard = () => {
            const allScores = getAllRecords();
            const oneWeekAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
            const weeklyScores = allScores.filter(record => record.timestamp >= oneWeekAgo);
            const playerScores = weeklyScores.reduce((acc, record) => {
                const key = `${record.fullName.toLowerCase().trim()}|${record.className.toLowerCase().trim()}`;
                if (!acc[key]) {
                    acc[key] = {
                        fullName: record.fullName,
                        className: record.className,
                        score: 0
                    };
                }
                acc[key].score += record.score;
                return acc;
            }, {});
            return Object.values(playerScores).sort((a, b) => b.score - a.score).slice(0, 10);
        };

        const getTotalXP = (fullName, className) => {
            if (!fullName.trim() || !className.trim()) return 0;
            const allScores = getAllRecords();
            const fNameLower = fullName.toLowerCase().trim();
            const cNameLower = className.toLowerCase().trim();
            return allScores
                .filter(record => 
                    record.fullName.toLowerCase().trim() === fNameLower &&
                    record.className.toLowerCase().trim() === cNameLower
                )
                .reduce((total, record) => total + record.score, 0);
        };
        
        // --- START: services/geminiService.ts ---
        // Since we cannot securely store API keys client-side, this part will be a placeholder
        // In a real app, this would be a call to a backend server
        const getExplanation = async (question) => {
            const apiKey = window.prompt("To get an AI explanation, please provide your Gemini API key:");
            if (!apiKey) {
                return "Vui lòng cung cấp API Key để sử dụng tính năng này.";
            }
            try {
                const { GoogleGenAI } = await import('@google/genai');
                const ai = new GoogleGenAI({ apiKey });
                const correctAnswerText = Array.isArray(question.correctAnswer) 
                    ? question.correctAnswer.join('", "') 
                    : question.correctAnswer;
                const prompt = `Hãy giải thích ngắn gọn bằng tiếng Việt tại sao đáp án đúng cho câu hỏi: "${question.question}" lại là "${correctAnswerText}".`;
                const response = await ai.models.generateContent({
                    model: 'gemini-2.5-flash',
                    contents: prompt,
                });
                return response.text;
            } catch (error) {
                console.error("Error with Gemini API:", error);
                return "Đã có lỗi xảy ra. Vui lòng kiểm tra API Key và thử lại.";
            }
        };

        // --- START: components/Loader.tsx ---
        const Loader = () => (
            <svg className="animate-spin h-10 w-10 text-blue-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        );

        // --- START: components/ExplanationModal.tsx ---
        const ExplanationModal = ({ isOpen, onClose, explanation, isLoading }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-50 p-4" onClick={onClose}>
                    <div className="bg-white rounded-2xl shadow-2xl p-6 md:p-8 max-w-2xl w-full" onClick={e => e.stopPropagation()}>
                        <h3 className="text-2xl font-bold text-blue-600 mb-4">Giải thích từ AI</h3>
                        {isLoading ? <div className="flex justify-center"><Loader /></div> : <div className="text-slate-700 whitespace-pre-wrap">{explanation}</div>}
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800">Close</button>
                    </div>
                </div>
            );
        };
        
        // --- All other components (StartScreen, QuizScreen, etc.) would be defined here as functions ---
        // For brevity, I'll combine them inside the main App component logic

        // --- START: App.tsx ---
        const shuffleArray = (array) => [...array].sort(() => Math.random() - 0.5);
        const QUESTIONS_SINGLE = 20;
        const QUESTIONS_MULTIPLE = 5;

        const App = () => {
            const [gameState, setGameState] = useState(GameState.START);
            const [finalScore, setFinalScore] = useState(0);
            const [correctCount, setCorrectCount] = useState(0);
            const [fullName, setFullName] = useState('');
            const [className, setClassName] = useState('');

            // ... (rest of the component logic from App.tsx) ...
            
            const handleStart = useCallback((name, cls) => {
              setFullName(name);
              setClassName(cls);
              setGameState(GameState.PREPARING);
            }, []);

            useEffect(() => {
              if (gameState === GameState.PREPARING) {
                const timer = setTimeout(() => setGameState(GameState.QUIZ), 1500);
                return () => clearTimeout(timer);
              }
            }, [gameState]);

            const activeQuestions = useMemo(() => {
              if (gameState !== GameState.QUIZ && gameState !== GameState.END) return [];
              const single = questions.filter(q => q.type === 'single');
              const multiple = questions.filter(q => q.type === 'multiple');
              const roundSingles = shuffleArray(single).slice(0, QUESTIONS_SINGLE);
              const roundMultiples = shuffleArray(multiple).slice(0, QUESTIONS_MULTIPLE);
              return shuffleArray([...roundSingles, ...roundMultiples]);
            }, [gameState]);

            const handleQuizEnd = useCallback((score, count) => {
              if (fullName && className) saveScore(fullName, className, score);
              setFinalScore(score);
              setCorrectCount(count);
              setGameState(GameState.END);
            }, [fullName, className]);
            
            const handleRestart = useCallback(() => {
              setFinalScore(0); setCorrectCount(0); setFullName(''); setClassName(''); setGameState(GameState.START);
            }, []);
            
            const handleViewLeaderboard = useCallback(() => setGameState(GameState.LEADERBOARD), []);
            const handleViewDashboard = useCallback(() => setGameState(GameState.TEACHER_DASHBOARD), []);


            // Render logic here
            const renderGameState = () => {
                // The components are defined inside this render function for simplicity in a single file
                const StartScreen = ({ onStart, onViewLeaderboard, onViewDashboard }) => {
                    const [fullName, setFullName] = useState('');
                    const [className, setClassName] = useState('');
                    const [totalXP, setTotalXP] = useState(0);

                    useEffect(() => {
                        const handler = setTimeout(() => {
                            if (fullName.trim() && className.trim()) setTotalXP(getTotalXP(fullName, className));
                            else setTotalXP(0);
                        }, 300);
                        return () => clearTimeout(handler);
                    }, [fullName, className]);

                    const canStart = fullName.trim().length > 0 && className.trim().length > 0;

                    return (
                        <div className="flex flex-col items-center justify-center h-screen bg-slate-100 p-4 text-center">
                            <h1 className="text-5xl md:text-6xl font-bold text-blue-600 mb-4">Ôn Tập Tin Học 10</h1>
                            <input type="text" placeholder="Nhập họ và tên..." value={fullName} onChange={e => setFullName(e.target.value)} className="w-full max-w-sm mx-auto px-4 py-3 mb-3 bg-white border-2 rounded-full text-center"/>
                            <input type="text" placeholder="Nhập lớp..." value={className} onChange={e => setClassName(e.target.value)} className="w-full max-w-sm mx-auto px-4 py-3 bg-white border-2 rounded-full text-center"/>
                            {totalXP > 0 && <p className="text-blue-600 mt-2">Tổng điểm: {totalXP} XP</p>}
                            <button onClick={() => onStart(fullName.trim(), className.trim())} disabled={!canStart} className="mt-8 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-full text-xl disabled:bg-slate-400">Bắt đầu</button>
                            <button onClick={onViewLeaderboard} className="mt-4 bg-transparent border border-slate-300 text-slate-600 hover:bg-slate-200 font-bold py-2 px-6 rounded-full">Bảng xếp hạng</button>
                            <div className="absolute top-4 right-4"><button onClick={onViewDashboard} className="text-xs text-slate-500">Teacher Dashboard</button></div>
                        </div>
                    );
                };
                
                // Other components (PreparingScreen, QuizScreen, EndScreen, etc.) would be defined similarly here
                
                // This is a simplified example. The full components would be here.
                switch (gameState) {
                    case GameState.START: return <StartScreen onStart={handleStart} onViewLeaderboard={handleViewLeaderboard} onViewDashboard={handleViewDashboard}/>;
                    case GameState.PREPARING: return <div>Preparing...</div>;
                    case GameState.QUIZ: return <div>Quiz Screen...</div>; // Placeholder for QuizScreen component
                    case GameState.END: return <div>End Screen...</div>; // Placeholder
                    case GameState.LEADERBOARD: return <div>Leaderboard...</div>; // Placeholder
                    case GameState.TEACHER_DASHBOARD: return <div>Teacher Dashboard...</div>; // Placeholder
                    default: return <StartScreen onStart={handleStart} onViewLeaderboard={handleViewLeaderboard} onViewDashboard={handleViewDashboard}/>;
                }
            };
            
            return <div className="min-h-screen">{renderGameState()}</div>;
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);

    </script>
</body>
</html>
